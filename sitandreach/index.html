<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAPFA Sit & Reach AI Scorer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        .video-container { position: relative; width: 100%; max-width: 640px; margin: auto; }
        video, canvas { border-radius: 0.5rem; width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none; }
        .slider-container { width: 100%; max-width: 640px; margin: auto; margin-top: 15px; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex flex-col items-center p-4">

    <div class="max-w-3xl w-full bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">NAPFA Sit & Reach AI Scorer</h1>

        <!-- Settings Row (Matches Sit Up App) -->
        <div class="flex flex-wrap justify-between gap-4 mb-4 bg-gray-50 p-4 rounded-md text-sm">
            <div>
                <label class="font-semibold block mb-1">Gender:</label>
                <select id="genderSelect" class="border p-2 rounded w-24">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>
            <div>
                <label class="font-semibold block mb-1">Age:</label>
                <select id="ageSelect" class="border p-2 rounded w-24">
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16" selected>16</option>
                </select>
            </div>
            <div>
                <label class="font-semibold block mb-1">Start Line (cm):</label>
                <input type="number" id="startLineCm" value="0" class="border p-2 rounded w-24">
            </div>
            <div>
                <label class="font-semibold block mb-1">End Line (cm):</label>
                <input type="number" id="endLineCm" value="50" class="border p-2 rounded w-24">
            </div>
        </div>

        <!-- Target Board -->
        <div class="mb-6 bg-blue-50 p-3 rounded-md text-center border border-blue-100">
            <h3 class="font-bold text-blue-800 mb-2">Required Standards (cm)</h3>
            <div id="targetBoard" class="flex justify-center gap-4 text-sm font-semibold">
                <!-- Populated via JS -->
            </div>
        </div>

        <!-- Dashboard (Colors perfectly match the Sit Up app: Gray, Blue, Green) -->
        <div class="grid grid-cols-3 gap-4 text-center mb-6">
            <div class="bg-gray-800 text-white p-4 rounded-lg shadow-md">
                <div class="text-sm uppercase tracking-wide">Current Reach</div>
                <div id="currentReachDisplay" class="text-3xl font-bold">0.0</div>
            </div>
            <div class="bg-blue-600 text-white p-4 rounded-lg shadow-md">
                <div class="text-sm uppercase tracking-wide">Hold Timer</div>
                <div id="holdTimerDisplay" class="text-3xl font-bold">Wait</div>
            </div>
            <div class="bg-green-500 text-white p-4 rounded-lg shadow-md">
                <div class="text-sm uppercase tracking-wide">Final Score</div>
                <div id="finalScoreDisplay" class="text-3xl font-bold">-</div>
            </div>
        </div>

        <!-- Camera Area -->
        <div class="video-container bg-black flex justify-center items-center shadow-inner relative">
            <div id="loadingText" class="absolute text-white z-0">Loading AI Camera...</div>
            <video id="videoElement" playsinline autoplay muted></video>
            <canvas id="canvasElement"></canvas>
            
            <!-- Warning Overlay -->
            <div id="foulWarning" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-2 rounded-full font-bold text-xl hidden z-20 shadow-lg">
                ⚠️ FOUL: KNEES BENT!
            </div>
        </div>

        <!-- Calibration Sliders -->
        <div class="slider-container space-y-4 bg-gray-50 p-4 rounded-md">
            <div>
                <label class="font-semibold text-red-600 text-sm">Align Start Line on Video (Position in %):</label>
                <input type="range" id="startSlider" min="0" max="100" value="20" class="w-full accent-red-600">
            </div>
            <div>
                <label class="font-semibold text-green-600 text-sm">Align End Line on Video (Position in %):</label>
                <input type="range" id="endSlider" min="0" max="100" value="80" class="w-full accent-green-600">
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-center gap-4 mt-6">
            <button id="startBtn" class="bg-green-600 text-white px-8 py-3 rounded-full font-bold shadow hover:bg-green-700 disabled:opacity-50">
                Start Test
            </button>
            <button id="resetBtn" class="bg-red-500 text-white px-8 py-3 rounded-full font-bold shadow hover:bg-red-600">
                Reset
            </button>
        </div>
        
        <p id="statusMsg" class="text-center mt-4 text-lg font-semibold text-gray-500">
            Align the physical lines using the sliders, then click Start.
        </p>
    </div>

    <script>
        // --- NAPFA SCORING MATRIX (Sit and Reach in CM) ---
        const napfaScoring = {
            "M": {
                "13": { A: 42, B: 38, C: 34, D: 30, E: 26 },
                "14": { A: 44, B: 40, C: 36, D: 32, E: 28 },
                "15": { A: 46, B: 42, C: 38, D: 34, E: 30 },
                "16": { A: 48, B: 44, C: 40, D: 36, E: 32 }
            },
            "F": {
                "13": { A: 44, B: 40, C: 36, D: 32, E: 28 },
                "14": { A: 46, B: 42, C: 38, D: 34, E: 30 },
                "15": { A: 47, B: 43, C: 39, D: 35, E: 31 },
                "16": { A: 48, B: 44, C: 40, D: 36, E: 32 }
            }
        };

        // --- DOM Elements ---
        const genderSelect = document.getElementById('genderSelect');
        const ageSelect = document.getElementById('ageSelect');
        const targetBoard = document.getElementById('targetBoard');
        
        const startLineCmInput = document.getElementById('startLineCm');
        const endLineCmInput = document.getElementById('endLineCm');
        const startSlider = document.getElementById('startSlider');
        const endSlider = document.getElementById('endSlider');

        const currentReachDisplay = document.getElementById('currentReachDisplay');
        const holdTimerDisplay = document.getElementById('holdTimerDisplay');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');
        const foulWarning = document.getElementById('foulWarning');
        const statusMsg = document.getElementById('statusMsg');
        const startBtn = document.getElementById('startBtn');

        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingText = document.getElementById('loadingText');

        // --- App State ---
        let isTesting = false;
        let testCompleted = false;
        let currentMaxReach = 0;
        let holdStartTime = 0;
        let bestScore = 0;
        const HOLD_DURATION = 2000; // 2 seconds

        // Update target board when age/gender changes
        function updateTargetBoard() {
            const matrix = napfaScoring[genderSelect.value][ageSelect.value];
            targetBoard.innerHTML = `
                <span class="text-green-700">A: ${matrix.A}+</span> <span class="text-gray-300">|</span>
                <span class="text-blue-700">B: ${matrix.B}+</span> <span class="text-gray-300">|</span>
                <span class="text-yellow-600">C: ${matrix.C}+</span> <span class="text-gray-300">|</span>
                <span class="text-orange-600">D: ${matrix.D}+</span> <span class="text-gray-300">|</span>
                <span class="text-red-600">E: ${matrix.E}+</span>
            `;
        }
        genderSelect.addEventListener('change', updateTargetBoard);
        ageSelect.addEventListener('change', updateTargetBoard);
        updateTargetBoard(); // Init

        // --- Controls ---
        startBtn.addEventListener('click', () => {
            if(isTesting) return;
            isTesting = true;
            testCompleted = false;
            bestScore = 0;
            currentMaxReach = 0;
            holdStartTime = 0;
            finalScoreDisplay.innerText = "-";
            startBtn.disabled = true;
            statusMsg.innerText = "Test Started! Push forward slowly and hold for 2 seconds.";
            statusMsg.className = "text-center mt-4 text-lg font-semibold text-green-600";
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isTesting = false;
            testCompleted = false;
            startBtn.disabled = false;
            currentReachDisplay.innerText = "0.0";
            holdTimerDisplay.innerText = "Wait";
            finalScoreDisplay.innerText = "-";
            statusMsg.innerText = "Align the physical lines using the sliders, then click Start.";
            statusMsg.className = "text-center mt-4 text-lg font-semibold text-gray-500";
            foulWarning.classList.add('hidden');
        });

        // --- Math & Logic ---
        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        // Convert pixel X coordinate to CM using linear interpolation
        function pixelsToCm(pixelX, canvasWidth) {
            const startX = (startSlider.value / 100) * canvasWidth;
            const endX = (endSlider.value / 100) * canvasWidth;
            const startCm = parseFloat(startLineCmInput.value);
            const endCm = parseFloat(endLineCmInput.value);

            if (startX === endX) return 0; 
            
            const ratio = (pixelX - startX) / (endX - startX);
            const cm = startCm + (ratio * (endCm - startCm));
            return cm;
        }

        function calculateGrade(scoreCm) {
            const matrix = napfaScoring[genderSelect.value][ageSelect.value];
            if (scoreCm >= matrix.A) return "A";
            if (scoreCm >= matrix.B) return "B";
            if (scoreCm >= matrix.C) return "C";
            if (scoreCm >= matrix.D) return "D";
            if (scoreCm >= matrix.E) return "E";
            return "Fail";
        }

        // --- MediaPipe Processing ---
        function onResults(results) {
            if(loadingText.style.display !== 'none') loadingText.style.display = 'none';

            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const w = canvasElement.width;
            const h = canvasElement.height;

            // Draw Calibration Lines
            const startLineX = (startSlider.value / 100) * w;
            const endLineX = (endSlider.value / 100) * w;
            const startCm = parseFloat(startLineCmInput.value);
            const endCm = parseFloat(endLineCmInput.value);

            canvasCtx.beginPath(); canvasCtx.moveTo(startLineX, 0); canvasCtx.lineTo(startLineX, h);
            canvasCtx.strokeStyle = "red"; canvasCtx.lineWidth = 3; canvasCtx.stroke();
            canvasCtx.fillStyle = "red"; canvasCtx.font = "bold 16px Arial";
            canvasCtx.fillText(`Start: ${startCm} cm`, startLineX + 10, 25);

            canvasCtx.beginPath(); canvasCtx.moveTo(endLineX, 0); canvasCtx.lineTo(endLineX, h);
            canvasCtx.strokeStyle = "lime"; canvasCtx.lineWidth = 3; canvasCtx.stroke();
            canvasCtx.fillStyle = "lime"; canvasCtx.fillText(`End: ${endCm} cm`, endLineX + 10, 25);

            if (results.poseLandmarks && isTesting && !testCompleted) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1});

                const landmarks = results.poseLandmarks;
                
                const leftFinger = landmarks[19];
                const rightFinger = landmarks[20];
                
                const furthestFingerX = Math.max(leftFinger.x * w, rightFinger.x * w);
                let currentCm = pixelsToCm(furthestFingerX, w);

                const hip = landmarks[23];
                const knee = landmarks[25];
                const ankle = landmarks[27];
                const kneeAngle = calculateAngle(hip, knee, ankle);
                
                let isFoul = false;
                if (kneeAngle < 165 && currentCm > startCm) {
                    isFoul = true;
                    foulWarning.classList.remove('hidden');
                } else {
                    foulWarning.classList.add('hidden');
                }

                if (!isFoul) {
                    if (currentCm > startCm) {
                        currentReachDisplay.innerText = currentCm.toFixed(1);
                        
                        const now = Date.now();
                        
                        if (currentCm > currentMaxReach + 1.0) { 
                            currentMaxReach = currentCm;
                            holdStartTime = now;
                            holdTimerDisplay.innerText = "Holding";
                        } else if (currentCm >= currentMaxReach - 1.5) { 
                            if (holdStartTime > 0) {
                                let heldFor = now - holdStartTime;
                                let timeLeft = ((HOLD_DURATION - heldFor) / 1000).toFixed(1);
                                holdTimerDisplay.innerText = timeLeft + "s";

                                if (heldFor >= HOLD_DURATION) {
                                    bestScore = currentMaxReach;
                                    let grade = calculateGrade(bestScore);
                                    finalScoreDisplay.innerText = `${bestScore.toFixed(1)} (${grade})`;
                                    testCompleted = true;
                                    statusMsg.innerText = "Test Complete! Great job.";
                                    statusMsg.className = "text-center mt-4 text-lg font-semibold text-blue-600";
                                    holdTimerDisplay.innerText = "LOCKED";
                                }
                            }
                        } else {
                            holdStartTime = 0;
                            currentMaxReach = currentCm; 
                            holdTimerDisplay.innerText = "Dropped";
                        }
                    }
                } else {
                    holdStartTime = 0;
                    holdTimerDisplay.innerText = "FOUL";
                }
            }
            canvasCtx.restore();
        }

        // --- Initialization ---
        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        camera.start();
    </script>
</body>
</html>
