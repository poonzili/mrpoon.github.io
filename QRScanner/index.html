<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-QR Scanner</title>
    
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: #f4f4f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input, select { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .video-container { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: auto; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        button { background: #0b57d0; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #0842a0; }
        
        #scanSheetBtn { background: #e37400; }
        #scanSheetBtn:hover { background: #b05700; }
        #scanSheetBtn.active { background: #137333; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        
        #cameraSelect { display: none; margin-top: 10px; }
        
        #status { margin-top: 15px; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center; transition: background 0.3s; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .neutral { background: #e2e3e5; color: #383d41; }
        .log { margin-top: 10px; font-size: 0.9em; color: #555; max-height: 180px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>Multi-QR Scanner</h2>

    <div class="card">
        <label>Target Google Sheet URL:</label>
        <input type="text" id="targetSheetUrl" placeholder="Paste link or scan QR code below...">
        
        <div class="button-group">
            <button id="scanSheetBtn" onclick="toggleSheetScanMode()">📷 Scan Sheet QR Code</button>
        </div>

        <label style="margin-top: 15px;">Scan Cooldown Per Code (Seconds):</label>
        <input type="number" id="cooldown" value="5" min="1">
    </div>

    <div class="video-container">
        <video id="webcam" playsinline autoplay muted></video>
        <canvas id="qr-canvas"></canvas>
    </div>
    
    <select id="cameraSelect"></select>
    <button id="startBtn" onclick="initCamera()">Start Camera</button>

    <div id="status" class="neutral">Tap "Start Camera" to begin</div>
    <div class="log" id="logList"></div>

    <script>
        // ==========================================
        // PASTE YOUR APPS SCRIPT WEB APP URL HERE
        // ==========================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2n6y06SohdigV-CmLxfDrniKNKDV1QRCeHaOdjGaekIJU1l1wNC7qGjm7u-TathGH/exec"; 
        
        const codeScanHistory = {}; 
        let videoElement, canvasElement, canvasCtx;
        let isScanning = false;
        let barcodeDetector = null;
        let audioCtx; 
        let currentStream = null; 
        let isScanningForSheetUrl = false; 
        let isLockedOut = false; // Prevents accidental double scans

        document.addEventListener("DOMContentLoaded", () => {
            const savedSheet = localStorage.getItem("targetSheetUrl");
            const savedCooldown = localStorage.getItem("cooldown");
            
            if (savedSheet) document.getElementById("targetSheetUrl").value = savedSheet;
            if (savedCooldown) document.getElementById("cooldown").value = savedCooldown;

            document.getElementById("targetSheetUrl").addEventListener("input", saveSettings);
            document.getElementById("cooldown").addEventListener("input", saveSettings);

            videoElement = document.getElementById("webcam");
            canvasElement = document.getElementById("qr-canvas");
            canvasCtx = canvasElement.getContext("2d");

            if ('BarcodeDetector' in window) {
                barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
            }
            
            document.getElementById("cameraSelect").addEventListener("change", initCamera);
        });

        function saveSettings() {
            localStorage.setItem("targetSheetUrl", document.getElementById("targetSheetUrl").value);
            localStorage.setItem("cooldown", document.getElementById("cooldown").value);
        }

        function toggleSheetScanMode() {
            isScanningForSheetUrl = !isScanningForSheetUrl;
            const btn = document.getElementById("scanSheetBtn");
            
            if (isScanningForSheetUrl) {
                btn.textContent = "🛑 Tap to Cancel Sheet Scan";
                btn.classList.add("active");
                updateStatus("Point camera at your Sheet URL QR code...", "neutral");
            } else {
                btn.textContent = "📷 Scan Sheet QR Code";
                btn.classList.remove("active");
                updateStatus("Camera active. Scanning normal data codes.", "neutral");
            }
        }

        function playSuccessFeedback() {
            try {
                if (navigator.vibrate) navigator.vibrate(150); 
                
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); 

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch (err) {
                console.log("Audio/Vibration error", err);
            }
        }

        async function populateCameraList() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const cameraSelect = document.getElementById("cameraSelect");
                
                cameraSelect.innerHTML = ''; 
                
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                
                if (currentStream) {
                    const activeTrack = currentStream.getVideoTracks()[0];
                    if (activeTrack) {
                        const activeSettings = activeTrack.getSettings();
                        if (activeSettings.deviceId) {
                            cameraSelect.value = activeSettings.deviceId;
                        }
                    }
                }
            } catch (err) {
                console.error("Error enumerating devices:", err);
            }
        }

        async function initCamera() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const cameraSelect = document.getElementById("cameraSelect");
                const selectedDeviceId = cameraSelect.value;
                
                const constraints = {
                    video: selectedDeviceId ? { deviceId: { exact: selectedDeviceId } } : { facingMode: "environment" }
                };
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                
                document.getElementById("startBtn").style.display = "none";
                
                if (cameraSelect.options.length === 0) {
                    await populateCameraList();
                    cameraSelect.style.display = "block";
                }

                updateStatus("Camera active. Scanning for QR codes...", "neutral");
                
                if (!isScanning) {
                    isScanning = true;
                    requestAnimationFrame(scanFrame);
                }
            } catch (err) {
                updateStatus("Error accessing camera. Please check browser permissions.", "error");
            }
        }

        async function scanFrame() {
            if (!isScanning) return;

            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                if (!isLockedOut) {
                    try {
                        let detectedTexts = [];

                        if (barcodeDetector) {
                            const barcodes = await barcodeDetector.detect(videoElement);
                            barcodes.forEach(barcode => {
                                detectedTexts.push(barcode.rawValue);
                                const { x, y, width, height } = barcode.boundingBox;
                                canvasCtx.strokeStyle = isScanningForSheetUrl ? "#FFA500" : "#00FF00"; 
                                canvasCtx.lineWidth = 6;
                                canvasCtx.strokeRect(x, y, width, height);
                            });
                        } else {
                            const scanCanvas = document.createElement('canvas');
                            scanCanvas.width = videoElement.videoWidth;
                            scanCanvas.height = videoElement.videoHeight;
                            scanCanvas.getContext('2d').drawImage(videoElement, 0, 0, scanCanvas.width, scanCanvas.height);
                            const hints = new Map();
                            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
                            const reader = new ZXing.MultiFormatReader();
                            reader.setHints(hints);
                            try {
                                const luminanceSource = new ZXing.HTMLCanvasElementLuminanceSource(scanCanvas);
                                const binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
                                const result = reader.decode(binaryBitmap);
                                if (result) detectedTexts.push(result.getText());
                            } catch (e) {}
                        }

                        if (detectedTexts.length > 0) {
                            if (isScanningForSheetUrl) {
                                processSheetUrlScan(detectedTexts[0]); 
                            } else {
                                processDetectedCodes(detectedTexts);
                            }
                        }
                    } catch (err) {}
                }
            }
            setTimeout(() => { requestAnimationFrame(scanFrame); }, 100);
        }

        function processSheetUrlScan(urlText) {
            playSuccessFeedback();
            document.getElementById("targetSheetUrl").value = urlText;
            saveSettings();
            
            // Lock scanning for 2 seconds so you have time to move the camera away
            isLockedOut = true;
            updateStatus("Sheet URL set! Move camera away...", "success");
            logMessage(`Target Sheet set to: ${urlText}`);

            setTimeout(() => {
                isLockedOut = false;
                toggleSheetScanMode(); // Safely toggle back to normal mode
            }, 2000);
        }

        function processDetectedCodes(codesArray) {
            const targetSheetUrl = document.getElementById("targetSheetUrl").value;
            const cooldownSeconds = parseInt(document.getElementById("cooldown").value, 10) || 5;
            const now = Date.now();

            if (!targetSheetUrl) {
                updateStatus("Error: Paste a Google Sheet link or scan a Sheet QR code first.", "error");
                return;
            }

            let newScansCount = 0;

            codesArray.forEach(qrText => {
                const lastScannedTime = codeScanHistory[qrText] || 0;

                if (now - lastScannedTime >= cooldownSeconds * 1000) {
                    codeScanHistory[qrText] = now; 
                    newScansCount++;
                    
                    fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ 
                            qrText: qrText,
                            targetSheetUrl: targetSheetUrl 
                        })
                    }).then(() => {
                        logMessage(`Saved: ${qrText}`);
                    }).catch(() => {
                        logMessage(`Error saving: ${qrText}`);
                    });
                }
            });

            if (newScansCount > 0) {
                playSuccessFeedback();
                updateStatus(`Detected ${codesArray.length} code(s). Sent ${newScansCount} new code(s)!`, "success");
            }
        }

        function updateStatus(msg, type) {
            const statusEl = document.getElementById("status");
            statusEl.textContent = msg;
            statusEl.className = type;
        }

        function logMessage(msg) {
            const logList = document.getElementById("logList");
            const logItem = document.createElement("div");
            logItem.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logList.prepend(logItem);
        }
    </script>
</body>
</html>
