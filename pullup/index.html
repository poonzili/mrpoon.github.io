<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAPFA Pull-Up AI Scorer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        .video-container { position: relative; width: 100%; max-width: 640px; margin: auto; }
        video, canvas { border-radius: 0.5rem; width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex flex-col items-center p-4">

    <div class="max-w-3xl w-full bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">NAPFA Pull-Up AI Scorer</h1>
        <p id="exerciseTypeLabel" class="text-center font-semibold text-gray-600 mb-4 bg-yellow-100 py-1 rounded">
            Exercise: Inclined Pull-Ups (30 Seconds)
        </p>

        <!-- Settings Row -->
        <div class="flex flex-wrap justify-between gap-4 mb-4 bg-gray-50 p-4 rounded-md">
            <div>
                <label class="font-semibold block mb-1">Gender:</label>
                <select id="genderSelect" class="border p-2 rounded">
                    <option value="M">Male</option>
                    <option value="F" selected>Female</option>
                </select>
            </div>
            <div>
                <label class="font-semibold block mb-1">Age:</label>
                <select id="ageSelect" class="border p-2 rounded">
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16" selected>16</option>
                </select>
            </div>
            <div class="flex items-end">
                <button id="toggleAudio" class="bg-blue-500 text-white px-4 py-2 rounded shadow hover:bg-blue-600">
                    🔊 Audio On
                </button>
            </div>
        </div>

        <!-- Target Goals Scoreboard -->
        <div class="mb-6 border-2 border-blue-200 bg-blue-50 p-4 rounded-md shadow-sm">
            <h2 class="text-sm uppercase tracking-wide font-bold text-center text-blue-800 mb-2">Target Reps Needed</h2>
            <div id="targetScores" class="flex justify-around text-lg font-bold">
                <div class="text-green-600 flex flex-col items-center"><span class="text-xs text-gray-500">Grade A</span> <span id="targetA">-</span></div>
                <div class="text-blue-500 flex flex-col items-center"><span class="text-xs text-gray-500">Grade B</span> <span id="targetB">-</span></div>
                <div class="text-yellow-500 flex flex-col items-center"><span class="text-xs text-gray-500">Grade C</span> <span id="targetC">-</span></div>
                <div class="text-orange-500 flex flex-col items-center"><span class="text-xs text-gray-500">Grade D</span> <span id="targetD">-</span></div>
                <div class="text-red-500 flex flex-col items-center"><span class="text-xs text-gray-500">Grade E</span> <span id="targetE">-</span></div>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="grid grid-cols-3 gap-4 text-center mb-6">
            <div class="bg-gray-800 text-white p-4 rounded-lg">
                <div class="text-sm uppercase tracking-wide">Time Left</div>
                <div id="timeDisplay" class="text-4xl font-bold">30s</div>
            </div>
            <div class="bg-blue-600 text-white p-4 rounded-lg">
                <div class="text-sm uppercase tracking-wide">Reps</div>
                <div id="repDisplay" class="text-4xl font-bold">0</div>
            </div>
            <div class="bg-green-500 text-white p-4 rounded-lg">
                <div class="text-sm uppercase tracking-wide">Grade</div>
                <div id="gradeDisplay" class="text-4xl font-bold">-</div>
            </div>
        </div>

        <!-- Camera Area -->
        <div class="video-container bg-black flex justify-center items-center shadow-inner relative">
            <div id="loadingText" class="absolute text-white z-0">Loading AI Camera...</div>
            <video id="videoElement" playsinline autoplay muted></video>
            <canvas id="canvasElement"></canvas>
        </div>

        <!-- Controls -->
        <div class="flex justify-center gap-4 mt-6">
            <button id="startBtn" class="bg-green-600 text-white px-8 py-3 rounded-full font-bold shadow hover:bg-green-700 disabled:opacity-50">
                Start 30-Sec Test
            </button>
            <button id="resetBtn" class="bg-red-500 text-white px-8 py-3 rounded-full font-bold shadow hover:bg-red-600">
                Reset
            </button>
        </div>
        
        <!-- Status Indicator -->
        <p id="formStatus" class="text-center mt-4 text-lg font-semibold text-gray-500">
            Position the camera to see your upper body.
        </p>
    </div>

    <script>
        // --- NAPFA SCORING DATA (Standard & Inclined Pull-Ups) ---
        // Format: { A, B, C, D, E } reps required
        const napfaScoring = {
            "M": {
                // Males < 15 do Inclined Pullups
                "13": { type: "Inclined", A: 25, B: 22, C: 17, D: 12, E: 7 },
                "14": { type: "Inclined", A: 26, B: 23, C: 18, D: 13, E: 8 },
                // Males >= 15 do Full Pull-ups
                "15": { type: "Full", A: 8, B: 6, C: 5, D: 3, E: 1 },
                "16": { type: "Full", A: 9, B: 7, C: 5, D: 3, E: 1 }
            },
            "F": {
                // Females of all ages do Inclined Pullups
                "13": { type: "Inclined", A: 17, B: 13, C: 10, D: 7, E: 3 },
                "14": { type: "Inclined", A: 17, B: 14, C: 10, D: 7, E: 3 },
                "15": { type: "Inclined", A: 17, B: 14, C: 10, D: 7, E: 3 },
                "16": { type: "Inclined", A: 18, B: 14, C: 11, D: 7, E: 3 }
            }
        };

        // --- APP STATE ---
        let reps = 0;
        let pullupState = "down"; 
        let isTesting = false;
        let timeLeft = 30;
        let timerInterval = null;
        let audioEnabled = true;
        let currentGrade = "-";
        let currentExercise = "Inclined"; 

        // --- DOM ELEMENTS ---
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const canvasCtx = canvasElement.getContext('2d');
        
        const repDisplay = document.getElementById('repDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const gradeDisplay = document.getElementById('gradeDisplay');
        const formStatus = document.getElementById('formStatus');
        const exerciseTypeLabel = document.getElementById('exerciseTypeLabel');
        const loadingText = document.getElementById('loadingText');

        const genderSelect = document.getElementById('genderSelect');
        const ageSelect = document.getElementById('ageSelect');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        // --- TARGET SCOREBOARD UPDATE LOGIC ---
        function updateTargetScoreboard() {
            const gender = genderSelect.value;
            const age = ageSelect.value;
            const data = napfaScoring[gender][age];

            currentExercise = data.type;
            
            // Update UI Labels
            exerciseTypeLabel.innerText = `Exercise: ${currentExercise === "Full" ? "Standard Pull-Ups" : "Inclined Pull-Ups"} (30 Seconds)`;
            document.getElementById('targetA').innerText = `≥ ${data.A}`;
            document.getElementById('targetB').innerText = `${data.B}-${data.A - 1}`;
            document.getElementById('targetC').innerText = `${data.C}-${data.B - 1}`;
            document.getElementById('targetD').innerText = `${data.D}-${data.C - 1}`;
            document.getElementById('targetE').innerText = `${data.E}-${data.D - 1}`;
            
            // Recalculate current grade immediately if test is active
            updateNapfaScore();
        }

        // Listeners for dropdowns
        genderSelect.addEventListener('change', updateTargetScoreboard);
        ageSelect.addEventListener('change', updateTargetScoreboard);

        // --- AUDIO ENGINE ---
        function speak(text) {
            if (!audioEnabled || isNaN(timeLeft)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        document.getElementById('toggleAudio').addEventListener('click', (e) => {
            audioEnabled = !audioEnabled;
            e.target.innerText = audioEnabled ? "🔊 Audio On" : "🔇 Audio Off";
            e.target.className = audioEnabled 
                ? "bg-blue-500 text-white px-4 py-2 rounded shadow hover:bg-blue-600" 
                : "bg-gray-400 text-white px-4 py-2 rounded shadow hover:bg-gray-500";
        });

        // --- TIMER & GRADING LOGIC ---
        startBtn.addEventListener('click', () => {
            if (isTesting) return;
            isTesting = true;
            reps = 0;
            timeLeft = 30; // 30 second limit for pull-ups
            currentGrade = "-";
            updateDisplays();
            speak("Ready, Set, Go!");
            formStatus.innerText = "Test Started! Pull!";
            formStatus.className = "text-center mt-4 text-lg font-semibold text-green-600";
            startBtn.disabled = true;

            timerInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.innerText = timeLeft + "s";
                
                if (timeLeft === 15) speak("15 seconds left!");
                if (timeLeft <= 5 && timeLeft > 0) speak(timeLeft.toString());

                if (timeLeft <= 0) endTest();
            }, 1000);
        });

        resetBtn.addEventListener('click', () => {
            endTest(true);
            reps = 0;
            timeLeft = 30;
            currentGrade = "-";
            updateDisplays();
            formStatus.innerText = "Position the camera to see your upper body.";
            formStatus.className = "text-center mt-4 text-lg font-semibold text-gray-500";
        });

        function endTest(manual = false) {
            isTesting = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            if (!manual) {
                speak(`Time's up! You did ${reps} reps. Grade ${currentGrade}.`);
                formStatus.innerText = `Test Over! Total Reps: ${reps}`;
                formStatus.className = "text-center mt-4 text-lg font-semibold text-blue-600";
            }
        }

        function updateNapfaScore() {
            const data = napfaScoring[genderSelect.value][ageSelect.value];
            let newGrade = "Fail";
            
            if (reps >= data.A) newGrade = "A";
            else if (reps >= data.B) newGrade = "B";
            else if (reps >= data.C) newGrade = "C";
            else if (reps >= data.D) newGrade = "D";
            else if (reps >= data.E) newGrade = "E";

            if (newGrade !== currentGrade && newGrade !== "Fail" && currentGrade !== "-") {
                speak(`Grade ${newGrade}!`);
            }
            currentGrade = newGrade;
            gradeDisplay.innerText = currentGrade;
        }

        function updateDisplays() {
            repDisplay.innerText = reps;
            timeDisplay.innerText = timeLeft + "s";
            updateNapfaScore();
        }

        // --- MATH & REP COUNTING (Vision Logic) ---
        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return angle;
        }

        function countRep(landmarks) {
            if (!isTesting) return;

            // Landmarks: 11: L-Shoulder, 13: L-Elbow, 15: L-Wrist, 0: Nose
            const shoulder = landmarks[11];
            const elbow = landmarks[13];
            const wrist = landmarks[15];
            const nose = landmarks[0];

            if (shoulder.visibility > 0.5 && elbow.visibility > 0.5 && wrist.visibility > 0.5) {
                
                if (currentExercise === "Full") {
                    // Standard Pull-Up Logic: Chin/Nose crosses wrist Y-axis
                    const armsExtended = calculateAngle(shoulder, elbow, wrist) > 150;
                    const chinOverBar = nose.y < wrist.y; 

                    if (armsExtended) pullupState = "down";
                    
                    if (chinOverBar && pullupState === "down") {
                        pullupState = "up";
                        reps++;
                        updateDisplays();
                        speak(reps.toString());
                    }
                } 
                else {
                    // Inclined Pull-Up Logic: Elbow angle breaks 90 degrees
                    const elbowAngle = calculateAngle(shoulder, elbow, wrist);
                    
                    if (elbowAngle > 150) pullupState = "down";
                    
                    if (elbowAngle < 85 && pullupState === "down") {
                        pullupState = "up";
                        reps++;
                        updateDisplays();
                        speak(reps.toString());
                    }
                }
            }
        }

        // --- MEDIAPIPE INITIALIZATION ---
        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});

        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults((results) => {
            if(loadingText.style.display !== 'none') loadingText.style.display = 'none';

            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1});
                countRep(results.poseLandmarks);
            }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => await pose.send({image: videoElement}),
            width: 640, height: 480
        });

        camera.start();
        
        // Initialize scoreboard on load
        updateTargetScoreboard();

    </script>
</body>
</html>
