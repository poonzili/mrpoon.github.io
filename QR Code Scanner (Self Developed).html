<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner</title>
    
    <!-- App Install Requirements -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b57d0">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg">

    <!-- QR Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: #f4f4f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; }
        #reader { width: 100%; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        #status { margin-top: 15px; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .neutral { background: #e2e3e5; color: #383d41; }
        .log { margin-top: 10px; font-size: 0.9em; color: #555; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>QR Scanner</h2>

    <div class="card">
        <label>Target Google Sheet URL:</label>
        <input type="text" id="targetSheetUrl" placeholder="Paste Google Sheet link here...">
        
        <label>Same-Code Cooldown (Seconds):</label>
        <input type="number" id="cooldown" value="5" min="1">
    </div>

    <div id="reader"></div>
    <div id="status" class="neutral">Waiting for settings...</div>
    <div class="log" id="logList"></div>

    <script>
        // ==========================================
        // PASTE YOUR APPS SCRIPT URL HERE
        // ==========================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2n6y06SohdigV-CmLxfDrniKNKDV1QRCeHaOdjGaekIJU1l1wNC7qGjm7u-TathGH/exec"; 
        
        // This object acts as a memory bank for specific QR codes
        let recentScans = {};

        document.addEventListener("DOMContentLoaded", () => {
            const savedSheet = localStorage.getItem("targetSheetUrl");
            const savedCooldown = localStorage.getItem("cooldown");
            
            if (savedSheet) document.getElementById("targetSheetUrl").value = savedSheet;
            if (savedCooldown) document.getElementById("cooldown").value = savedCooldown;

            document.getElementById("targetSheetUrl").addEventListener("input", saveSettings);
            document.getElementById("cooldown").addEventListener("input", saveSettings);

            const scanner = new Html5QrcodeScanner("reader", { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                rememberLastUsedCamera: false 
            });
            scanner.render(onScanSuccess);
        });

        function saveSettings() {
            localStorage.setItem("targetSheetUrl", document.getElementById("targetSheetUrl").value);
            localStorage.setItem("cooldown", document.getElementById("cooldown").value);
        }

        function updateStatus(msg, type) {
            const statusEl = document.getElementById("status");
            statusEl.textContent = msg;
            statusEl.className = type;
            
            const logList = document.getElementById("logList");
            const logItem = document.createElement("div");
            logItem.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logList.prepend(logItem);
        }

        function triggerFeedback() {
            if (navigator.vibrate) {
                navigator.vibrate(200); 
            }

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine'; 
                oscillator.frequency.value = 880; 

                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1); 

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1); 
            } catch (e) {
                console.log("Audio feedback failed: ", e);
            }
        }

        function onScanSuccess(decodedText) {
            const targetSheetUrl = document.getElementById("targetSheetUrl").value;
            const cooldownSeconds = parseInt(document.getElementById("cooldown").value, 10) || 5;
            const now = Date.now();

            if (!targetSheetUrl) {
                updateStatus("Error: Paste a Google Sheet link above.", "error");
                return;
            }

            // Check if THIS SPECIFIC code was scanned recently
            const lastTimeThisCodeWasScanned = recentScans[decodedText] || 0;

            if (now - lastTimeThisCodeWasScanned < cooldownSeconds * 1000) { 
                return; // Ignore if the exact same code is within its cooldown window
            }
            
            // Record the new time for this specific code
            recentScans[decodedText] = now;
            
            triggerFeedback();
            
            updateStatus(`Scanned: ${decodedText}. Sending...`, "success");

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 
                    qrText: decodedText,
                    targetSheetUrl: targetSheetUrl 
                })
            }).then(() => {
                updateStatus(`Saved: ${decodedText}`, "success");
            }).catch(err => {
                updateStatus(`Network error while saving.`, "error");
            });
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
